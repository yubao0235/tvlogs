name: IPTV Traffic Speed Test

on:
  workflow_dispatch:

jobs:
  run-speed-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出公开库（作为算力节点容器）
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🎯 2. 【新增】跨库检出私库，并将其放入 private_repo 目录
      - name: Checkout Private Data Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}
          fetch-depth: 0
          path: private_repo
          persist-credentials: true

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 4. 安装脚本依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 5. 执行测速脚本，并将工作区变量指定到私库目录
      - name: Run Traffic Test Script
        env:
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo  # 🎯 指向私库防区
        run: |
          python md/traffic_test.py

      # 6. 自动提交并推送测速报告回到私库（或者按需提交）
      - name: Commit and Push Reports to Private Repo
        run: |
          cd private_repo
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [ -f "md/traffic_report.txt" ] || [ -f "md/traffic_summary.json" ]; then
            git add md/traffic_report.txt md/traffic_summary.json 2>/dev/null || true
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update traffic speed test report [skip ci]" && git push)
          else
            echo "⚠️ 未检测到生成的测速报告文件，跳过提交。"
          fi
