name: Hotel IPTV Auto Gather

on:
  schedule:
    - cron: '10 */4 * * *'  # 每 4 小时的第 10 分钟自动运行
  workflow_dispatch:       # 允许你在公开库页面上手动点击按钮触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_hotel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          persist-credentials: true         

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 1. 正常运行你的抓取源脚本
      - name: Run Hotel Gather Script
        env:
          PYTHONUNBUFFERED: "1"  
        run: |
          echo "🚀 开始执行酒店源自动化抓取与归属地解析..."
          python md/hotel_gather.py

      # 🎯 2.【精妙联动】抓取完新源后，立刻原地重新生成静态大表账本
      - name: Generate Web Index
        run: |
          echo "🌐 [联动] 检测到新源抓取完毕，正在实时同步更新前端静态大表..."
          python md/generate_index.py

      - name: Commit and Push Changes to Private Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🎯 优化点：暂存所有变动（包含新抓的 m3u，以及刚更新的 index.html 和 snapshot.json）
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现任何变动，跳过提交"
          else
            git commit -m "📊 覆盖更新：Hotel IPTV 列表及快照大表 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            echo "🚀 正在将最新抓取的基因和同步后的网页强制推送到私库..."
            git push origin main --force
          fi
