name: Hotel IPTV Stream Validation & Cleanup

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨 2 点自动运行一次深度清洗
  workflow_dispatch:         # 支持手动触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_hotels:
    runs-on: ubuntu-latest
    
    steps:
      # 1️⃣ 检出公开库（获取脚本文件）
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # 2️⃣ 跨库检出私库到隔离路径 private_repo
      - name: Checkout Private Data Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          path: private_repo
          persist-credentials: true         

      # 3️⃣ 配置 Python 环境并安装依赖与 FFmpeg
      - name: Set up Python & Install FFmpeg
        run: |
          python -m pip install --upgrade pip
          pip install httpx
          sudo apt-get update && sudo apt-get install -y ffmpeg

      # 4️⃣ 运行清洗与检测脚本：通过环境变量强行接管私库的 hotels 目录
      - name: Run Hotel Validation Script
        env:
          PYTHONUNBUFFERED: "1"  
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          echo "🚀 开始对私库 hotels 目录下的源进行双重有效性检测与清理..."
          python md/check_hotels.py

      # 5️⃣ 提交并精准推送清理后的变动到私库
      - name: Commit and Push Cleaned Results to Private Repo
        run: |
          cd private_repo
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 暂存 hotels 目录下的所有变动（包含被删除的死源和更新后的 ALL.m3u）
          git add hotels/ 2>/dev/null || true
          
          # 检查是否有文件改动，有则提交
          if git diff --staged --quiet; then
            echo "✨ 没有发现失效源需要清理，工作区保持整洁。"
          else
            git commit -m "🧹 定时死源清理与 ALL.m3u 重建：[自动巡检] $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            echo "🔄 正在拉取远程私库最新状态并安全变基..."
            git pull --rebase -X ours origin main
            
            echo "🚀 正在将清理结果同步至私库..."
            git push origin main
          fi
