name: Hotel IPTV Daily Refresh

on:
  schedule:
    - cron: '20 */4 * * *'  # 严格的 5 位格式
  workflow_dispatch:       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'yubao0235/live'
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          persist-credentials: true         

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests tqdm urllib3 aiohttp

      - name: Real-time Execution Scan
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python md/scan_hotel.py

      - name: Rebuild M3U Lists
        run: |
          python md/rebuild_m3u.py

      - name: IPTV Speed Test
        run: |
          if [ -f "md/traffic_test.py" ]; then
            python md/traffic_test.py
          else
            echo "⚠️ 找不到测速脚本"
          fi

      # 🎯 【新增步骤】调用新编写的 HTML 页面生成脚本
      - name: Generate Web Index
        run: |
          echo "🌐 正在根据测速结果和列表生成 index.html..."
          python md/generate_index.py

      - name: Commit and Push to Private Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存所有修改（包括根目录下新生成的 index.html）
          git add -A
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现变动，跳过提交"
            exit 0
          fi

          git commit -m "📊 IPTV Web Portal & Lists Auto Update: $(date +'%Y-%m-%d %H:%M') [skip ci]"

          echo "🔄 正在同步远程私库并处理冲突..."
          git pull --rebase -X ours origin main

          echo "🚀 正在将最新网页和列表推送到私库..."
          git push origin main
