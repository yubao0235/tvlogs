name: Full Private Repo KV Auto-Sync

on:
  schedule:
    - cron: '10 */4 * * *'  # 每8 小时全自动洗版测速一次
  workflow_dispatch:          # 支持手动触发

concurrency:
  group: full-private-kv-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository (仅存放工作流文件)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1️⃣ 把完整的私库（存有 hotel、hotels 和 md 文件夹）克隆下来
      - name: Clone Private Repository
        env:
          LIVE_TOKEN: ${{ secrets.LIVE_TOKEN }}
          LIVE_REPO: ${{ secrets.LIVE_REPO }}
        run: |
          if [ -z "$LIVE_TOKEN" ] || [ -z "$LIVE_REPO" ]; then
            echo "❌ 错误: 未配置私库的 LIVE_TOKEN 或 LIVE_REPO 密钥！"
            exit 1
          fi
          echo "🔄 正在克隆私库以获取全部三个核心文件夹..."
          git clone https://x-access-token:${LIVE_TOKEN}@github.com/${LIVE_REPO}.git private_source_repo

      # 2️⃣ 分别为各个文件夹生成独立的 JSON 快照
      - name: Generate Segmented Snapshots
        run: |
          echo "📦 正在分别打包各个核心目录..."
          python - << 'EOF'
          import os
          import json
          import time

          source_base = "private_source_repo"
          target_dirs = ["hotel", "hotels", "md"]

          for d in target_dirs:
              disk_path = os.path.join(source_base, d)
              snapshot = {
                  "updated_at": time.strftime('%Y-%m-%d %H:%M:%S'),
                  "files": {}
              }
              
              if os.path.exists(disk_path):
                  print(f"📁 正在打包目录: {d}")
                  for dirpath, _, filenames in os.walk(disk_path):
                      if ".git" in dirpath or ".github" in dirpath:
                          continue
                      for f in filenames:
                        full_path = os.path.join(dirpath, f)
                        rel_from_base = os.path.relpath(full_path, source_base)
                        rel_path = rel_from_base.replace("\\", "/")
                        try:
                            with open(full_path, "r", encoding="utf-8", errors="ignore") as file_obj:
                                snapshot["files"][rel_path] = file_obj.read()
                        except Exception as e:
                            print(f"⚠️ 读取文件 {rel_path} 失败: {e}")
              else:
                  print(f"⚠️ 目录 {disk_path} 不存在，生成空快照。")

              # 每个文件夹单独存为一个对应的 json 文件
              out_filename = f"snapshot_{d}.json"
              with open(out_filename, "w", encoding="utf-8") as out:
                  json.dump(snapshot, out, ensure_ascii=False)
              print(f"✅ {out_filename} 生成成功！包含文件数: {len(snapshot['files'])}")
          EOF

      # 3️⃣ 分别将各个 JSON 快照推送至 Cloudflare KV 的不同 Key 中
      - name: Upload Segmented Snapshots to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "🚀 正在将分片快照分别推送至 Cloudflare KV..."

          for d in hotel hotels md; do
            FILE="snapshot_${d}.json"
            KV_KEY="iptv_snapshot_${d}"

            if [ -f "$FILE" ]; then
              echo "➡️ 正在推送 $FILE 到 KV Key: $KV_KEY"
              RESPONSE=$(curl -s -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/$KV_KEY" \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                --data-binary "@$FILE")

              if echo "$RESPONSE" | grep -q '"success":true'; then
                echo "✅ Key [$KV_KEY] 同步成功！"
              else
                echo "⚠️ Key [$KV_KEY] 写入失败: $RESPONSE"
                exit 1
              fi
            else
              echo "❌ 找不到分片文件 $FILE !"
              exit 1
            fi
          done
          echo "✨ 所有分片快照全部成功同步至 Cloudflare KV！"

      # 4️⃣ 把分片 JSON 提交保存回公开库
      - name: Commit snapshot files to Public Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add snapshot_*.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ 公开库分片快照文件没有变动。"
          else
            git commit -m "📊 [自动更新] 同步最新分片快照账本: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin main
            echo "✅ 分片快照文件已成功提交回公开库。"
          fi

      # 5️⃣ 把分片 JSON 同步推送到私库根目录
      - name: Sync snapshot files to Private Repo
        run: |
          cd private_source_repo
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          cp ../snapshot_*.json ./
          git add snapshot_*.json
          
          if git diff --staged --quiet; then
            echo "✅ 私库中的分片快照已经是最新。"
          else
            git commit -m "🔄 [同步] 更新一致的分片快照文件: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase -X ours origin main || true
            git push origin main
            echo "✅ 私库分片快照已成功同步！"
          fi
