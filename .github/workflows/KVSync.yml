name: Public Repo KV Auto-Sync

on:
  push:
    branches:
      - main
    paths:
      - 'hotel/**'
      - 'hotels/**'
      - 'md/**'
  workflow_dispatch:          # 支持手动一键触发

concurrency:
  group: public-kv-sync-${{ github.ref }}
  cancel-in-progress: false   # 确保每次更新都能完整执行完

jobs:
  pack_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1️⃣ 按层级路径打包生成 snapshot.json
      - name: Generate Hierarchical Snapshot JSON
        run: |
          echo "📦 正在将公开库最新 hotel、hotels 及 md 目录按层级路径打包成 snapshot.json..."
          python - << 'EOF'
          import os
          import json
          import time

          root_dir = "."
          target_dirs = ["hotel", "hotels", "md"]

          snapshot = {
              "updated_at": time.strftime('%Y-%m-%d %H:%M:%S'),
              "files": {}
          }

          for d in target_dirs:
              if os.path.exists(d):
                  for dirpath, _, filenames in os.walk(d):
                      if ".git" in dirpath or ".github" in dirpath:
                          continue
                      for f in filenames:
                          full_path = os.path.join(dirpath, f)
                          rel_path = os.path.relpath(full_path, root_dir).replace("\\", "/")
                          try:
                              with open(full_path, "r", encoding="utf-8", errors="ignore") as file_obj:
                                  snapshot["files"][rel_path] = file_obj.read()
                          except Exception as e:
                              print(f"⚠️ 读取文件 {rel_path} 失败: {e}")

          with open("snapshot.json", "w", encoding="utf-8") as out:
              json.dump(snapshot, out, ensure_ascii=False)

          print(f"✅ snapshot.json 打包成功！共收录了 {len(snapshot['files'])} 个资产文件。")
          EOF

      # 2️⃣ 直推 snapshot.json 到 Cloudflare KV
      - name: Upload Snapshot to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "🚀 正在将最新快照直接推送至 Cloudflare KV..."
          
          if [ -f "snapshot.json" ]; then
            RESPONSE=$(curl -s -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/iptv_snapshot" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              --data-binary "@snapshot.json")
              
            echo "Cloudflare KV 响应: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"success":true'; then
              echo "✅ 成功同步到 Cloudflare KV！"
            else
              echo "⚠️ KV 写入失败，请检查公开库中的 Cloudflare Secrets 配置。"
              exit 1
            fi
          else
            echo "❌ 找不到 snapshot.json 文件！"
            exit 1
          fi

      # 3️⃣ 把生成的 snapshot.json 提交回公开库保存
      - name: Commit snapshot.json to Public Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add snapshot.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ snapshot.json 没有变动。"
          else
            git commit -m "📊 [自动更新] 同步最新文件结构与 snapshot.json 快照账本: $(date +'%Y-%m-%d %H:%M') [skip ci]"
            git push origin main
            echo "✅ snapshot.json 已成功提交回公开库。"
          fi
