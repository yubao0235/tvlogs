name: Hotel IPTV Auto Gather

on:
  schedule:
    - cron: '10 */4 * * *'  # 每 4 小时的第 10 分钟自动运行
  workflow_dispatch:       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_hotel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          persist-credentials: true         

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run Hotel Gather Script
        env:
          PYTHONUNBUFFERED: "1"  
        run: |
          python md/hotel_gather.py

      - name: Generate Web Index
        run: |
          python md/generate_index.py

      - name: Commit and Push Changes to Private Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🎯 核心修复：严禁使用 git add -A！只精准添加这个工作流产生变动的文件
          git add hotel/*.m3u index.html snapshot.json
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现任何变动，跳过提交"
          else
            git commit -m "📊 覆盖更新：Hotel IPTV 列表及快照大表 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            # 🎯 核心修复：取消 --force 强推！采用安全变基策略推送，绝不覆盖私库的其他历史或文件
            echo "🔄 正在同步远程私库并处理潜在冲突..."
            git pull --rebase -X ours origin main
            
            echo "🚀 正在将最新结果安全推送到私库..."
            git push origin main
          fi
