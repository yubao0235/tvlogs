name: Hotel IPTV Auto Gather

on:
  schedule:
    - cron: '10 */4 * * *'  # 每 4 小时的第 10 分钟自动运行
  workflow_dispatch:       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_hotel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          persist-credentials: true         

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 🎯 【安全加锁 1】在运行抓取前，先备份当前的 hotel 目录，防止被 Python 脚本物理清空
      - name: Backup Current Assets
        run: |
          if [ -d "hotel" ]; then
            cp -r hotel hotel_backup
            echo "✅ 成功为现有资产建立安全防区"
          fi

      - name: Run Hotel Gather Script
        env:
          PYTHONUNBUFFERED: "1"  
        run: |
          echo "🚀 开始执行酒店源自动化抓取与归属地解析..."
          python ./md/hotel_gather.py

      # 🎯 【安全加锁 2】脚本跑完后，把备份里有、但被脚本不小心删掉的历史老文件全部还原回来！
      # 这样即使脚本里有清空逻辑，老文件也会被原地复活，绝对不会丢失！
       calm-restore:
      - name: Restore Non-Updated Assets
        run: |
          if [ -d "hotel_backup" ]; then
            echo "🔄 正在比对并强制补回非更新的历史资产..."
            cp -n hotel_backup/* hotel/ 2>/dev/null || true
            rm -rf hotel_backup
          fi

      - name: Generate Web Index
        run: |
          echo "🌐 [联动] 正在同步更新前端静态大表..."
          python ./md/generate_index.py

      - name: Commit and Push Changes to Private Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🎯 【安全加锁 3】严禁添加整个文件夹！
          # 我们只通过通配符精准暂存：存在的 m3u 文件、网页和账本。
          # 这样 Git 只会记录“新增”和“修改”，那些没有被抓取到的老文件由于被我们复活了，不会被判定为删除！
          git add hotel/*.m3u index.html snapshot.json
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现任何新内容变动，跳过提交"
          else
            git commit -m "📊 增量覆盖更新：Hotel IPTV 列表及快照大表 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            echo "🔄 正在同步远程私库并处理潜在冲突..."
            git pull --rebase -X ours origin main
            
            echo "🚀 正在将最新结果安全推送到私库..."
            git push origin main
          fi
