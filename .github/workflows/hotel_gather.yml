name: Hotel IPTV Auto Gather (Runner Mode)

on:
  schedule:
    - cron: '10 */4 * * *'  # 每 4 小时的第 10 分钟自动运行
  workflow_dispatch:         

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_hotel:
    runs-on: ubuntu-latest
    
    steps:
      # 1️⃣ 检出公开库（提供算力和 md/ 下的运行脚本）
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # 2️⃣ 跨库检出私库到专门的临时隔离路径 `private_repo` 下
      - name: Checkout Private Data Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          path: private_repo # 🎯 隔离区：保护私有文件
          persist-credentials: true         

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 3️⃣ 【安全机制 1】运行前，先备份私库中的原有 hotel 种子目录，防止被冲掉
      - name: Backup Current Private Assets
        run: |
          if [ -d "private_repo/hotel" ]; then
            cp -r private_repo/hotel private_repo/hotel_backup
            echo "✅ 成功为私库现有基因资产建立安全防区"
          fi

      # 4️⃣ 运行公开库下的抓取脚本：注入 LIVE_WORKSPACE 强行接管私库路径
      - name: Run Hotel Gather Script
        env:
          PYTHONUNBUFFERED: "1"  
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo # 🎯 核心锚定点
        run: |
          echo "🚀 开始由公开库代工执行酒店源自动化抓取与归属地解析..."
          python md/hotel_gather.py

      # 5️⃣ 【安全机制 2】脚本跑完后，利用 cp -n 把备份里的老基因文件安全还魂
      - name: Restore Non-Updated Assets to Private Repo
        run: |
          if [ -d "private_repo/hotel_backup" ]; then
            echo "🔄 正在比对并强制补回非更新的历史资产..."
            cp -n private_repo/hotel_backup/* private_repo/hotel/ 2>/dev/null || true
            rm -rf private_repo/hotel_backup
          fi

      # 6️⃣ 精准推送回私库（已移除静态网页大表和快照账本的同步）
      - name: Commit and Push Changes to Private Repo
        run: |
          # 必须先切入私库子目录
          cd private_repo
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 🎯 【安全机制 3】精准追踪 hotel 目录下的新增和修改源文件
          git add hotel/*.m3u
          
          if git diff --staged --quiet; then
            echo "✅ 私库数据对比没有发现任何新变化，安全跳过提交。"
          else
            git commit -m "📊 增量覆盖更新：[公开库代工] Hotel IPTV 列表 $(date +'%Y-%m-%d %H:%M') [skip ci]"
            
            echo "🔄 正在拉取远程私库最新状态并安全变基..."
            git pull --rebase -X ours origin main
            
            echo "🚀 正在将抓取成果安全同步至私库中..."
            git push origin main
          fi
