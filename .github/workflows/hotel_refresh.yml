name: Hotel IPTV Daily Refresh

on:
  schedule:
    - cron: '20 */4 * * *'  # 严格的 5 位格式
  workflow_dispatch:       

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          persist-credentials: true         

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests tqdm urllib3 aiohttp

      # 🎯 【安全护甲 1】运行前强行备份大表成品库 hotels 目录
      - name: Backup Current Finished Assets
        run: |
          if [ -d "hotels" ]; then
            cp -r hotels hotels_backup
            echo "✅ 成功为洗版成品资产库建立安全防区"
          fi

      - name: Real-time Execution Scan
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python md/scan_hotel.py

      - name: Rebuild M3U Lists
        run: |
          python md/rebuild_m3u.py

      - name: IPTV Speed Test
        run: |
          if [ -f "md/traffic_test.py" ]; then
            python md/traffic_test.py
          else
            echo "⚠️ 找不到测速脚本"
          fi

      # 🎯 【安全护甲 2】脚本与测速跑完后，利用 cp -n 完美借尸还魂，确保没发生更新的历史源百分之百存活
      - name: Restore Non-Updated Finished Assets
        run: |
          if [ -d "hotels_backup" ]; then
            echo "🔄 正在比对并强制补回未参与本次洗版的历史成品资产..."
            cp -n hotels_backup/* hotels/ 2>/dev/null || true
            rm -rf hotels_backup
          fi

      - name: Generate Web Index
        run: |
          python md/generate_index.py

      - name: Commit and Push to Private Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 🎯 【安全护甲 3】只精准锁定可能更新的文件与最终大表，不给 Git 任何机会去同步删除动作
          git add hotels/*.m3u md/traffic_report.txt md/traffic_summary.json index.html snapshot.json
          
          if git diff --staged --quiet; then
            echo "✅ 没有发现变动，跳过提交"
            exit 0
          fi

          git commit -m "📊 IPTV Web Portal & Lists Auto Update: $(date +'%Y-%m-%d %H:%M') [skip ci]"

          echo "🔄 正在同步远程私库并处理冲突..."
          git pull --rebase -X ours origin main

          echo "🚀 正在将最新网页和列表推送到私库..."
          git push origin main
