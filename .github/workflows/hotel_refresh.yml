name: Hotel IPTV Daily Refresh (Sanitizer)

on:
  schedule:
    - cron: '20 */8 * * *'  # 每8 小时全自动洗版测速一次
  workflow_dispatch:         

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出公开库（仅仅用来作为算力节点和执行容器）
      - name: Checkout Public Repo (As Runner Context)
        uses: actions/checkout@v4

      # 2️⃣ 跨库检出私库，并强制将其下载到专用的临时防区 `private_repo` 下
      - name: Checkout Private Data Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          path: private_repo  # 🎯 核心隔离点：将私库完全装进这个子文件夹里
          persist-credentials: true         

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Compute Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests tqdm urllib3 aiohttp

      # 3️⃣ 【安全护甲】在运行前，备份私库中原有的成品大表，防止被物理抹除
      - name: Create Private Repo Finished Assets Backup
        run: |
          if [ -d "private_repo/hotels" ]; then
            cp -r private_repo/hotels private_repo/hotels_backup
            echo "✅ 成功为私库的成品资产建立了全隔离安全防区"
          fi

      # 4️⃣ 运行爆破扫描
      - name: Run Real-time Execution Scan
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          python md/scan_hotel.py

      # 5️⃣ 运行清洗重组
      - name: Rebuild M3U Lists
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          python md/rebuild_m3u.py

      # 6️⃣ 运行多线程流媒体测速
      - name: IPTV Speed Test
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo  # 🎯 关键：把私库路径传进去
        run: |
          if [ -f "md/traffic_test.py" ]; then
            python md/traffic_test.py
          else
            echo "⚠️ 找不到测速脚本，跳过此步"
          fi
      # 7️⃣ 【安全护甲还原】补回未参与本次清洗的历史成品资源
      - name: Restore Non-Updated Finished Assets
        run: |
          if [ -d "private_repo/hotels_backup" ]; then
            echo "🔄 正在跨目录比对，强制补回未参与本次洗版的历史成品资产..."
            cp -n private_repo/hotels_backup/* private_repo/hotels/ 2>/dev/null || true
            rm -rf private_repo/hotels_backup
          fi

      # 8️⃣ 运行大表索引前端生成
      - name: Generate Web Index
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          if [ -f "md/generate_index.py" ]; then
            python md/generate_index.py
          else
            echo "ℹ️ 如果有 generate_index.py，请确保其也适配了 LIVE_WORKSPACE 变量"
          fi

      # 9️⃣ 跨库精准推流：强行同步计算产物到私库
      - name: Commit and Push Changes Directly to Private Repo
        run: |
          echo "🔄 正在强行从公开工作区搬运最新计算产物到私库防区..."
          
          mkdir -p private_repo/hotels
          mkdir -p private_repo/md
          
          if [ -d "hotels" ]; then
            cp -r hotels/* private_repo/hotels/ || true
          fi
          
          if [ -f "md/traffic_report.txt" ]; then
            cp md/traffic_report.txt private_repo/md/traffic_report.txt || true
          fi
          if [ -f "md/traffic_summary.json" ]; then
            cp md/traffic_summary.json private_repo/md/traffic_summary.json || true
          fi
          if [ -f "md/dead_hosts.txt" ]; then
            cp md/dead_hosts.txt private_repo/md/dead_hosts.txt || true
          fi
          
          if [ -f "index.html" ]; then
            cp index.html private_repo/index.html || true
          fi
          if [ -f "snapshot.json" ]; then
            cp snapshot.json private_repo/snapshot.json || true
          fi
          
          cd private_repo
          
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.html snapshot.json hotels/*.m3u md/traffic_summary.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ 暂存区无实质变动，跳过推送。"
            exit 0
          fi

          git commit -m "📊 [自动更新] 同步最新文件结构与 snapshot.json 快照账本: $(date +'%Y-%m-%d %H:%M')"
          git push origin main

      # 🔟 联动 Cloudflare API 自动清空边缘缓存
      - name: Purge Cloudflare Cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "🧹 正在向 Cloudflare 发送边缘缓存清理指令..."
          RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
               -H "Authorization: Bearer $CF_API_TOKEN" \
               -H "Content-Type: application/json" \
               --data '{"purge_everything":true}')
          
          echo "Cloudflare 响应: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "✅ Cloudflare 缓存全量清空成功！"
          else
            echo "⚠️ 缓存清理可能未完全成功，请检查 Token 权限。"
          fi
