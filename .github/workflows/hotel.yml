name: Hotel IPTV Daily Refresh (Sanitizer)

on:
  schedule:
    - cron: '10 2,10,18 * * *'  # 每 8 小时全自动洗版与合流一次
  workflow_dispatch:         

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出公开库（作为算力与执行容器）
      - name: Checkout Public Repo (As Runner Context)
        uses: actions/checkout@v4

      # 2️⃣ 跨库检出私库，强制将其下载到专用的临时防区 `private_repo` 下
      - name: Checkout Private Data Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LIVE_REPO }}
          token: ${{ secrets.LIVE_TOKEN }}  
          fetch-depth: 0
          path: private_repo  
          persist-credentials: true         

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Compute Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests tqdm urllib3 aiohttp

      # 3️⃣ 运行爆破扫描（生成最新原始数据到私库根目录）
      - name: Run Real-time Execution Scan
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          python md/scan_hotel.py

      # 4️⃣ 运行智能洗版与全量融合（内部自动全量合并为 ALL.m3u）
      - name: Rebuild and Merge M3U Lists
        env:
          PYTHONUNBUFFERED: "1"
          LIVE_WORKSPACE: ${{ github.workspace }}/private_repo
        run: |
          python md/rebuild_m3u.py

      # 5️⃣ 精准推流：安全提交计算产物到私库
      - name: Commit and Push Changes Directly to Private Repo
        run: |
          echo "🔄 正在将最新扫描与洗版产物推送到私库..."
          
          cd private_repo
          
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1️⃣ 保护现场：清理或暂存本地未提交的杂项更改，防止 rebase 冲突报错
          git stash || true
          
          # 2️⃣ 获取远程最新分支并执行变基同步
          git fetch origin main
          git rebase origin/main || git rebase --abort || true
          
          # 3️⃣ 恢复刚才暂存的内容
          git stash pop || true
          
          # 4️⃣ 精准添加目标产物目录
          git add hotels/ md/ hotel_output.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "✅ 暂存区无实质变动，跳过推送。"
            exit 0
          fi

          git commit -m "📊 [自动更新] 同步最新 IPTV 洗版与 ALL.m3u 总表: $(date +'%Y-%m-%d %H:%M')"
          
          # 5️⃣ 推送前再做一次重试拉取，确保万无一失
          git pull --rebase origin main || true
          git push origin main
